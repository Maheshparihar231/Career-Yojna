<div class="container pt-4 mx-auto sm:max-w-xl md:max-w-full lg:max-w-screen-xl md:px-24 lg:px-8">
    <!-- Content Type Toggle -->
    <div class="flex justify-center mb-6">
        <mat-button-toggle-group [(ngModel)]="selectedContentType" (change)="onContentTypeChange()">
            <mat-button-toggle value="jobs">
                <mat-icon>work</mat-icon>
                Jobs
            </mat-button-toggle>
            <mat-button-toggle value="blogs">
                <mat-icon>article</mat-icon>
                Blogs
            </mat-button-toggle>
        </mat-button-toggle-group>
    </div>

    <!-- Jobs Section -->
    <div *ngIf="selectedContentType === 'jobs'">
        <div class="mb-6">
            <mat-accordion>
                <mat-expansion-panel>
                    <mat-expansion-panel-header>
                        <mat-panel-title>
                            <mat-icon class="mr-2">add_circle</mat-icon>
                            Add New Job
                        </mat-panel-title>
                        <mat-panel-description>
                            Click here to post a new job
                        </mat-panel-description>
                    </mat-expansion-panel-header>
                    <app-upload-job></app-upload-job>
                </mat-expansion-panel>
            </mat-accordion>
        </div>
        <div class="flex flex-col items-center justify-center">
            <h2 class="text-2xl font-bold mb-4">Posted Jobs</h2>
            <div class="w-full">
                <app-jobs-table #jobsTable [showEditDelete]="true"></app-jobs-table>
            </div>
        </div>
    </div>

    <!-- Blogs Section -->
    <div *ngIf="selectedContentType === 'blogs'">
        <div class="mb-6">
            <mat-accordion>
                <mat-expansion-panel>
                    <mat-expansion-panel-header>
                        <mat-panel-title>
                            <mat-icon class="mr-2">post_add</mat-icon>
                            Create New Blog
                        </mat-panel-title>
                        <mat-panel-description>
                            Click here to write a new blog post
                        </mat-panel-description>
                    </mat-expansion-panel-header>
                    <app-blog-management (blogCreated)="refreshTables()" (blogUpdated)="refreshTables()"></app-blog-management>
                </mat-expansion-panel>
            </mat-accordion>
        </div>
        <div class="flex flex-col items-center justify-center">
            <h2 class="text-2xl font-bold mb-4">Published Blogs</h2>
            <div class="w-full">
                <app-blogs-table #blogsTable [showEditDelete]="true"></app-blogs-table>
            </div>
        </div>
    </div>

    <!-- Empty State -->
    <div *ngIf="!selectedContentType" class="flex flex-col items-center justify-center py-12">
        <mat-icon class="text-6xl mb-4 text-gray-400">category</mat-icon>
        <h3 class="text-xl font-medium text-gray-600">Select a content type to manage</h3>
        <p class="text-gray-500">Choose between Jobs and Blogs from the toggle above</p>
    </div>
</div>
