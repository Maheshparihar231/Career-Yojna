<header class="bg-gradient-to-br from-purple-400 via-purple-500 to-primary-600 backdrop-blur-md shadow-2xl sticky top-0 z-50 border-b border-white/10">
    <nav class="mx-auto flex max-w-7xl items-center justify-between px-4 py-3 lg:px-8" aria-label="Global">
        <!-- Logo Section -->
        <div class="flex lg:flex-1">
            <a href="#" class="group flex items-center space-x-3 py-2 px-4 rounded-xl hover:bg-white/15 transition-all duration-300 ease-out transform hover:scale-105">
                <img class="h-11 w-auto transition-transform duration-300 group-hover:rotate-12" src="../../../assets/images/Career_Yojna.png" alt="Career Yojna">
                <span class="text-white font-bold text-lg hidden md:block tracking-tight">Career Yojna</span>
            </a>            
        </div>

        <!-- Mobile Menu Button -->
        <div class="flex lg:hidden">
            <button type="button" 
                    (click)="toggleMobileMenu()"
                    class="inline-flex items-center justify-center rounded-lg p-2.5 text-white hover:bg-white/20 active:bg-white/30 transition-all duration-200 ease-out">
                <span class="sr-only">{{ mobileMenuOpen ? 'Close' : 'Open' }} main menu</span>
                <svg *ngIf="!mobileMenuOpen" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
                </svg>
                <svg *ngIf="mobileMenuOpen" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <!-- Navigation Links -->
        <div class="hidden lg:flex lg:gap-x-2 items-center">
            <!-- Explore Link -->
            <a routerLink="/search" (click)="closeMobileMenu()"
               class="group flex items-center justify-center gap-x-2 px-5 py-2.5 text-sm font-medium text-white/90 hover:text-white hover:bg-white/15 rounded-lg transition-all duration-300 ease-out transform hover:translate-x-0.5">
                <mat-icon class="text-base leading-none">explore</mat-icon>
                <span class="leading-none">Explore</span>
                <div class="absolute bottom-0 left-5 right-5 h-0.5 bg-white/40 rounded-full scale-x-0 group-hover:scale-x-100 transition-transform duration-300 ease-out"></div>
            </a>

            <!-- About Link -->
            <a href="#" (click)="closeMobileMenu()"
               class="group flex items-center justify-center gap-x-2 px-5 py-2.5 text-sm font-medium text-white/90 hover:text-white hover:bg-white/15 rounded-lg transition-all duration-300 ease-out transform hover:translate-x-0.5">
                <mat-icon class="text-base leading-none">info</mat-icon>
                <span class="leading-none">About Us</span>
                <div class="absolute bottom-0 left-5 right-5 h-0.5 bg-white/40 rounded-full scale-x-0 group-hover:scale-x-100 transition-transform duration-300 ease-out"></div>
            </a>

            <!-- Blog Link -->
            <a routerLink="/blogs" (click)="closeMobileMenu()"
               class="group flex items-center justify-center gap-x-2 px-5 py-2.5 text-sm font-medium text-white/90 hover:text-white hover:bg-white/15 rounded-lg transition-all duration-300 ease-out transform hover:translate-x-0.5">
                <mat-icon class="text-base leading-none">article</mat-icon>
                <span class="leading-none">Blog</span>
                <div class="absolute bottom-0 left-5 right-5 h-0.5 bg-white/40 rounded-full scale-x-0 group-hover:scale-x-100 transition-transform duration-300 ease-out"></div>
            </a>

            <!-- User Section -->
            <div *ngIf="isLoggedIn" class="flex items-center gap-x-3 ml-4 pl-4 border-l border-white/20">
                <!-- Dashboard Button -->
                <button (click)="goToData()"
                        class="group flex items-center gap-x-2 px-5 py-2.5 text-sm font-medium text-white/90 hover:text-white hover:bg-white/15 rounded-lg transition-all duration-300 ease-out transform hover:scale-105">
                    <mat-icon class="text-lg">dashboard</mat-icon>
                    <span class="hidden lg:inline">Dashboard</span>
                </button>

                <!-- User Profile Menu -->
                <div class="relative">
                    <button [matMenuTriggerFor]="userMenu"
                            class="group flex items-center gap-x-2 px-4 py-2.5 bg-white/15 hover:bg-white/25 text-sm font-medium text-white rounded-lg transition-all duration-300 ease-out border border-white/10 hover:border-white/30 active:scale-95">
                        <div class="flex items-center gap-x-2">
                            <div class="w-7 h-7 rounded-full bg-gradient-to-br from-purple-300 to-primary-300 flex items-center justify-center">
                                <mat-icon class="text-sm text-white/80">account_circle</mat-icon>
                            </div>
                            <span class="max-w-xs truncate font-semibold hidden xl:inline">{{ currentUser?.displayName || currentUser?.email }}</span>
                        </div>
                        <svg class="h-4 w-4 text-white/60 transition-transform duration-300 group-hover:text-white/80" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd"
                                d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z"
                                clip-rule="evenodd" />
                        </svg>
                    </button>

                    <!-- User Dropdown Menu -->
                    <mat-menu #userMenu="matMenu" class="custom-menu">
                        <div class="px-4 py-3 border-b border-gray-200">
                            <p class="text-xs text-gray-500 uppercase tracking-wider font-semibold">Account</p>
                        </div>
                        <button mat-menu-item disabled class="text-gray-600 text-sm py-2">
                            <mat-icon class="mr-2">email</mat-icon>
                            <span class="truncate">{{ currentUser?.email }}</span>
                        </button>
                        <mat-divider class="my-2"></mat-divider>
                        <button mat-menu-item (click)="signOut()" class="text-red-600 hover:text-red-700 hover:bg-red-50 text-sm py-2 font-medium transition-all duration-200">
                            <mat-icon class="mr-2">logout</mat-icon>
                            <span>Sign Out</span>
                        </button>
                    </mat-menu>
                </div>
            </div>
        </div>
    </nav>

    <!-- Mobile Navigation Menu -->
    <div *ngIf="mobileMenuOpen" class="lg:hidden bg-purple-500/95 backdrop-blur-sm border-t border-white/10 overflow-hidden">
        <div class="px-4 py-4 space-y-3">
            <!-- Mobile Navigation Links -->
            <a routerLink="/search" (click)="closeMobileMenu()"
               class="flex items-center gap-x-3 px-4 py-3 rounded-lg text-white hover:bg-white/15 transition-all duration-200">
                <mat-icon class="text-lg">explore</mat-icon>
                <span class="font-medium">Explore</span>
            </a>

            <a href="#" (click)="closeMobileMenu()"
               class="flex items-center gap-x-3 px-4 py-3 rounded-lg text-white hover:bg-white/15 transition-all duration-200">
                <mat-icon class="text-lg">info</mat-icon>
                <span class="font-medium">About Us</span>
            </a>

            <a routerLink="/blogs" (click)="closeMobileMenu()"
               class="flex items-center gap-x-3 px-4 py-3 rounded-lg text-white hover:bg-white/15 transition-all duration-200">
                <mat-icon class="text-lg">article</mat-icon>
                <span class="font-medium">Blog</span>
            </a>

            <!-- Mobile User Section -->
            <div *ngIf="isLoggedIn" class="border-t border-white/20 pt-4 mt-4 space-y-3">
                <p class="text-xs uppercase tracking-wider font-semibold text-white/70 px-4">Account</p>
                
                <button (click)="goToData(); closeMobileMenu()"
                        class="w-full flex items-center gap-x-3 px-4 py-3 rounded-lg text-white hover:bg-white/15 transition-all duration-200">
                    <mat-icon class="text-lg">dashboard</mat-icon>
                    <span class="font-medium">Dashboard</span>
                </button>

                <div class="px-4 py-2 bg-white/10 rounded-lg">
                    <p class="text-xs text-white/70 mb-2">Logged in as:</p>
                    <p class="text-sm font-medium text-white truncate">{{ currentUser?.displayName || currentUser?.email }}</p>
                </div>

                <button (click)="signOut(); closeMobileMenu()"
                        class="w-full flex items-center gap-x-3 px-4 py-3 rounded-lg text-red-200 hover:bg-red-500/20 transition-all duration-200">
                    <mat-icon class="text-lg">logout</mat-icon>
                    <span class="font-medium">Sign Out</span>
                </button>
            </div>
        </div>
    </div>
</header>
