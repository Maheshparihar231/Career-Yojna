<mat-progress-bar *ngIf="showProgressBar" mode="determinate" [value]="uploadProgress"></mat-progress-bar>

<!-- Error Display -->
<div *ngIf="uploadError" class="error-message p-3 mb-4 bg-red-100 border border-red-400 text-red-700 rounded">
    <div class="flex items-center">
        <mat-icon class="text-red-500 mr-2">error</mat-icon>
        <span>{{ uploadError }}</span>
    </div>
</div>

<div class="p-4 justify-center items-center">
    <form (submit)="upload($event)">
        <div class="flex flex-col items-center space-x-6">
            <div class="shrink-0 mb-4 relative">
                <img id="preview_img" class="object-cover border-2 border-gray-300 rounded-lg" 
                     style="height: 200px; width: 200px;" 
                     [src]="previewImageUrl"
                     alt="Banner preview" />
                
                <!-- Upload Status Overlay -->
                <div *ngIf="isUploading" class="absolute inset-0 bg-black bg-opacity-50 flex items-center justify-center rounded-lg">
                    <div class="text-white text-center">
                        <mat-spinner diameter="30"></mat-spinner>
                        <p class="mt-2 text-sm">Uploading...</p>
                    </div>
                </div>
                
                <!-- Success Status -->
                <div *ngIf="!isUploading && !uploadError && previewImageUrl !== 'https://placehold.co/200'" 
                     class="absolute top-2 right-2 bg-green-500 text-white rounded-full p-1">
                    <mat-icon class="text-sm">check</mat-icon>
                </div>
            </div>
            
            <label class="block">
                <span class="sr-only">Choose banner image</span>
                <input type="file" 
                       (change)="loadFile($event)" 
                       accept="image/*"
                       [disabled]="isUploading"
                       class="block pointer-events-none w-full text-sm text-slate-500
                              file:mr-4 file:py-2 file:px-4
                              file:rounded-full file:border-0
                              file:text-sm file:font-semibold
                              file:bg-violet-50 file:text-violet-700
                              hover:file:bg-violet-100
                              disabled:opacity-50 disabled:cursor-not-allowed" />
            </label>
            
            <!-- File Info Display -->
            <div *ngIf="previewImageUrl !== 'https://placehold.co/200' && !uploadError" 
                 class="text-sm text-gray-600 text-center">
                <p class="text-green-600">
                    <mat-icon class="text-sm align-middle mr-1">check_circle</mat-icon>
                    Image ready for upload
                </p>
                <p class="text-xs text-gray-500 mt-1">Maximum file size: 5MB</p>
            </div>
        </div>
        
        <div class="mt-6 flex gap-2">
            <button type="button" 
                    (click)="clearFile()" 
                    mat-button 
                    [disabled]="isUploading"
                    class="flex-1">
                <mat-icon>clear</mat-icon>
                Clear
            </button>
            <button type="submit" 
                    [disabled]="isUploading || uploadError || previewImageUrl === 'https://placehold.co/200'"
                    mat-raised-button 
                    color="primary"
                    class="flex-1">
                <mat-icon *ngIf="!isUploading">cloud_upload</mat-icon>
                <mat-spinner *ngIf="isUploading" diameter="20"></mat-spinner>
                {{ isUploading ? 'Uploading...' : 'Upload' }}
            </button>
        </div>
    </form>
</div>
